<script>
function formatTraceTimestamp(value){
  if(typeof value!=='string'||!value.trim())return 'Not available';
  const parsed=new Date(value);
  if(Number.isNaN(parsed.getTime()))return 'Not available';
  try{return new Intl.DateTimeFormat(undefined,{dateStyle:'long',timeStyle:'medium'}).format(parsed)}catch{return parsed.toISOString()}
}
function formatDuration(value){
  if(value===null||value===undefined||value==='')return 'Not available';
  const duration=Number(value);
  if(!Number.isFinite(duration)||duration<0)return 'Not available';
  if(duration>=1000)return `${(duration/1000).toFixed(2)} s`;
  const rounded=Math.round(duration*10)/10;
  return `${Number.isInteger(rounded)?rounded:rounded.toFixed(1)} ms`;
}
function formatReportPath(value){return typeof value==='string'&&value.trim()?value:'No report generated'}

  const queue=[id],visited=new Set(queue);

  return false;
}
